name: Probe sitemaps
on:
  push:
    branches: [probe-sitemaps]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[extract,nepali]"
      - run: python deploy/probe/probe2.py
