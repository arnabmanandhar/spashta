name: Probe sitemaps
on:
  push:
    branches: [probe-sitemaps]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[extract,nepali]"
      - run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from urllib.parse import urljoin
          from spashta.fetch import Fetcher
          from spashta.samples import seed_sources
          from spashta.ingest.discover import COMMON_SITEMAPS, backfill_items, resolve
          from spashta.ingest.sitemap import parse_sitemap, looks_like_sitemap
          f = Fetcher(delay_s=0.5)
          since, until = datetime(2026,10,10,tzinfo=timezone.utc), datetime(2026,10,12,23,59,tzinfo=timezone.utc)
          for s in seed_sources():
              print("=" * 70, "\n", s.url, flush=True)
              try:
                  robots = f.sitemaps_from_robots(s.url)
              except Exception as e:
                  robots = []; print("  robots error", e)
              print("  robots sitemaps:", robots[:6])
              for root in list(dict.fromkeys(robots + [urljoin(s.url, p) for p in COMMON_SITEMAPS]))[:6]:
                  try:
                      r = f.get(root); t = r.text
                  except Exception as e:
                      print(f"  {root}: ERROR {str(e)[:120]}"); continue
                  if not looks_like_sitemap(t):
                      print(f"  {root}: not a sitemap ({r.url} {t[:80]!r})"); continue
                  sm = parse_sitemap(t)
                  print(f"  {root}: index children={len(sm.children)} entries={len(sm.entries)}")
                  for c in sm.children[:3] + ["..."] + sm.children[-3:]:
                      print("     ", c, sm.child_lastmod.get(c))
                  ds = sorted(e.published for e in sm.entries if e.published)
                  if sm.entries:
                      print("     entries dated:", len(ds), ds[0] if ds else None, ds[-1] if ds else None, sm.entries[0].url)
              try:
                  src = resolve(s, f)
                  items = backfill_items(src, f, since, until, 5000)
                  print(f"  resolved {src.kind} {src.endpoint} -> backfill 10-12 Oct: {len(items)} items", flush=True)
              except Exception as e:
                  print("  backfill error", e)
          PY
