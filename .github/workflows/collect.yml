name: Collect corpus

# Runs ingest every 3 hours on GitHub's machines, so nothing has to stay
# switched on at home. The store (live.db) lives between runs as an
# encrypted asset on the "collector-data" release: the repository is
# public and the store holds publishers' full text, so it is never saved
# unencrypted. See docs/COLLECT.md for setup, seeding and downloading.
#
# Needs: repository secret SPASHTA_STORE_KEY (any long random passphrase;
# keep a copy, it is the only way to open the store). Without it the run
# is a dry run: it collects two days into a throwaway store to show which
# outlets answer, and saves nothing.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 */3 * * *"
  push:
    paths:
      - .github/workflows/collect.yml
      - deploy/collect.py

permissions:
  contents: write

# One run at a time: each run starts from the store the previous one saved.
concurrency:
  group: collect-store
  cancel-in-progress: false

env:
  TAG: collector-data
  BACKFILL_FROM: "2026-09-26"
  GH_TOKEN: ${{ github.token }}
  SPASHTA_STORE_KEY: ${{ secrets.SPASHTA_STORE_KEY }}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[extract,nepali]"

      - name: Restore the store
        id: restore
        run: |
          set -euo pipefail
          mkdir -p data enc
          dec() { openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -pass env:SPASHTA_STORE_KEY -in "$1" | gunzip > "$2"; }
          if [ -z "$SPASHTA_STORE_KEY" ]; then
            echo "::warning::SPASHTA_STORE_KEY is not set: dry run, nothing will be saved"
            echo "BACKFILL_FROM=$(date -u -d '2 days ago' +%F)" >> "$GITHUB_ENV"
            echo "mode=dry" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "mode=save" >> "$GITHUB_OUTPUT"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --prerelease --title "Collector store (encrypted)" \
              --notes "Encrypted snapshots of the ingest store, written by the Collect corpus workflow. Not a release of the software. See docs/COLLECT.md."
          fi
          assets=$(gh release view "$TAG" --json assets --jq '.assets | sort_by(.createdAt) | reverse | .[].name')
          latest=$(echo "$assets" | grep '^live-.*\.db\.gz\.enc$' | head -n 1 || true)
          if [ -n "$latest" ]; then
            gh release download "$TAG" -p "$latest" -D enc
            dec "enc/$latest" data/live.db
            echo "restored $latest ($(du -h data/live.db | cut -f1))"
          else
            echo "no saved store yet: starting a new one"
          fi
          if echo "$assets" | grep -qx 'seed.db.gz.enc'; then
            gh release download "$TAG" -p seed.db.gz.enc -D enc
            dec enc/seed.db.gz.enc data/seed.db
            echo "seed=data/seed.db" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect
        id: collect
        run: |
          set +e
          budget=240; [ "${{ steps.restore.outputs.mode }}" = dry ] && budget=30
          seed="${{ steps.restore.outputs.seed }}"
          python deploy/collect.py data/live.db --budget-min "$budget" ${seed:+--seed "$seed"}
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Save the store
        if: steps.restore.outputs.mode == 'save' && steps.collect.outputs.code != '3'
        run: |
          set -euo pipefail
          name="live-$(date -u +%Y%m%dT%H%MZ)-${GITHUB_RUN_ID}.db.gz.enc"
          gzip -c data/live.db | openssl enc -e -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -salt -pass env:SPASHTA_STORE_KEY -out "$name"
          # Prove the upload opens again before trusting it.
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -pass env:SPASHTA_STORE_KEY -in "$name" | gunzip | cmp - data/live.db
          gh release upload "$TAG" "$name"
          echo "saved $name ($(du -h "$name" | cut -f1))"
          if [ -n "${{ steps.restore.outputs.seed }}" ]; then
            gh release delete-asset "$TAG" seed.db.gz.enc -y
          fi
          # Keep the four newest stores; older ones are only a fallback.
          gh release view "$TAG" --json assets --jq '.assets | map(select(.name | startswith("live-"))) | sort_by(.createdAt) | reverse | .[4:] | .[].name' |
            while read -r old; do gh release delete-asset "$TAG" "$old" -y; done

      - name: Result
        run: |
          code="${{ steps.collect.outputs.code }}"
          [ "$code" = 0 ] || { echo "::error::collection exited with $code (3 = store not saved)"; exit 1; }
