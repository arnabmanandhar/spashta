[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spashta"
version = "1.1.0"
description = "News integrity reports for Nepali and English: ingestion, bilingual hybrid retrieval and evidence-backed credibility signals."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Arnab Manandhar" }]
dependencies = [
  "pydantic>=2.0",
  "numpy>=1.24",
  "anchor-rag-eval @ git+https://github.com/arnabmanandhar/anchor",
]

[project.optional-dependencies]
extract = ["trafilatura>=1.8"]
ml = ["sentence-transformers>=3.0"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
nepali = ["nepali-datetime>=1.0"]
dev = ["pytest>=7.4", "ruff>=0.6", "httpx>=0.27", "spashta[extract,api,nepali]"]

[project.scripts]
spashta = "spashta.cli:main"

[tool.setuptools]
packages = ["spashta", "spashta.ingest", "spashta.analysis"]

[tool.setuptools.package-data]
spashta = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 125
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP"]
ignore = ["E501", "S101", "B008", "B905", "UP007", "UP045", "E731"]  # B008: FastAPI Depends() idiom

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"benchmarks/*" = ["S"]
"spashta/dataset/*" = ["S311"]  # seeded sampling for reproducibility, not security
